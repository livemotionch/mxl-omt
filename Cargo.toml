[package]
name = "lm-mxl-omt"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Bridge between MXL and Open Media Transport (OMT), with NMOS IS-04/IS-05"
license = "MIT"
publish = false

[lib]
name = "lm_mxl_omt"
path = "src/lib.rs"

[[bin]]
name = "lm-mxl-omt"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
libc = "0.2"
libloading = "0.8"
# Official MXL Rust bindings at the platform pin (release/v1.1 218ddaa), as the
# mxl-stack functions use them. libmxl is loaded at run time.
mxl = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-nmos = { git = "https://github.com/LeeO86/mxl-nmos", tag = "v0.1.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

[profile.test]
opt-level = 2

[profile.release]
debug = 1

[dev-dependencies]
tempfile = "3.27"
